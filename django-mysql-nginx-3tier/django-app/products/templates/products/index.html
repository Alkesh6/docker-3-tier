<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker 3-Tier Demo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f8; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background: #f0f0f0; }
        h1 { margin-top: 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>Django + MySQL + Nginx</h1>
    <p>Products retrieved from MySQL through Django.</p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
        {% for product in products %}
            <tr>
                <td>{{ product.id }}</td>
                <td>{{ product.name }}</td>
                <td>₹{{ product.price }}</td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="3">No products found. Add sample data using the README instructions.</td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
